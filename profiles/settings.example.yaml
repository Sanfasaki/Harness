ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: high
# 模型目录（llm-deepseek 的 settings 用户层，热加载：改完下一个请求就生效，无需重启）。
# name 就是 UI 模型菜单里显示的那行字，故一律以「模型 id 开头」，方便在菜单里认 id。
llm-deepseek:
  models:
    - id: deepseek-flash
      name: deepseek-flash（V4.1 Flash・当前默认）
      contextWindow: 1000000
      inputModalities: [text, image]
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    - id: deepseek-v4-flash-vision-exp
      name: deepseek-v4-flash-vision-exp（旧别名→V4.1）
      contextWindow: 1000000
      inputModalities: [text, image]
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    - id: deepseek-v4-flash
      name: deepseek-v4-flash（旧别名→V4.1）
      contextWindow: 1000000
    - id: deepseek-v4-pro
      name: deepseek-v4-pro（V4 Pro，9/14 起路由到 V4.1）
      contextWindow: 1000000
