# DeepSeek Harness Web UI — 公网入口（8080，HTTPS 自签证书）
# dsh 只绑 127.0.0.1:3080（官方禁 0.0.0.0 防 RCE），nginx 做公网出口 + 密码鉴权 + TLS
# 必须 HTTPS：crypto.randomUUID 等 Web Crypto API 只在安全上下文可用，HTTP 下 dsh 前端报错
server {
    listen 8080 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/dsh.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 访问密码（/etc/nginx/.htpasswd-dsh，用户名 dsh）
    auth_basic "DeepSeek Harness";
    auth_basic_user_file /etc/nginx/.htpasswd-dsh;

    # dsh-skin 外观插件把壁纸以 base64 存进配置，多预设时状态可达数 MB；
    # 默认 1m 会 413 拒绝保存请求（曾导致预设静默丢失），提高到应用内上限 256MB。
    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;        # WebSocket（agent 实时输出）
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;   # 保留端口（$host 会丢 :8080，导致 dsh browser-trust 围栏不匹配 → 403）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                       # agent 长任务
    }
}
