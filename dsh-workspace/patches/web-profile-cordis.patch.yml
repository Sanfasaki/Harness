# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# 本文件是"个性化 patch 模板"，开发区版本 /Sanfasaki/dsh-workspace/patches/ 为准，
# 部署到 $DSH_HOME/profiles/web/cordis.patch.yml 后需 systemctl restart dsh.service。

- insert:
    - id: dsh-skin
      name: 'dsh-skin'

- insert:
    - id: dsh-cursor
      name: 'dsh-cursor'

# 显式声明 workspace 指令通道（AGENTS.md）为启用。
# 说明（2026-09-14 实测）：dsh-web-app bundle 里这一行写着 disabled: true，
# `dsh --dump-config` 也照样打印 disabled: true，但**运行时的 web 实例实际是启用的** ——
# 写入 ~/.dsh/AGENTS.md 后，当前会话立刻收到了注入（同理 dump 里 disabled 的 tool-todo /
# tool-web 在会话中也都在）。结论：dump-config 对 disabled 与 settings 用户层都不可信，
# 判断运行时行为只能实测。此处显式写 false 是为了防止将来 bundle 层变化时被关掉。
- id: agent-instructions
  disabled: false

# 模型目录与默认模型**不在这里**，而在 $DSH_HOME/settings.yaml（settings 用户层）：
#   * 默认模型 → agent-default-model 段（provider/model/reasoningEffort）
#   * 可选模型目录（含 UI 菜单显示名）→ llm-deepseek.models
# 放那里的原因：llm-deepseek 支持 settings 热加载 —— 官方模块注释写明
# "base URL, catalog, or key reaches the very next request without restarting anything"，
# 改完下一个请求即生效，**不需要重启**；而 patch 是启动期配置，改一次就得重启一次。
# 现成模板见仓库 profiles/settings.example.yaml。
#
# 历史：2026-09-10 本文件曾用 `- id: llm-deepseek / config: models:`（注意 config 是整体替换，
# 必须列全要保留的模型）来加 V4.1 Flash；2026-09-14 迁到 settings.yaml 以消除双来源。
